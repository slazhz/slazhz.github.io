# Move this file to .github/workflows/update-steam-stats.yml (see README).
# Every day it refreshes data/steam.json with the visualizer's Steam Workshop numbers.
name: Update Steam stats

on:
  schedule:
    - cron: '17 1 * * *'   # every day at 01:17 UTC (08:17 in Thailand)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-steam.mjs
      - name: Commit if the numbers changed
        run: |
          if git diff --quiet data/steam.json; then
            echo "Nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/steam.json
            git commit -m "Update Steam stats"
            git push
          fi
