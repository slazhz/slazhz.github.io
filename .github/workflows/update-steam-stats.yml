# Every hour it refreshes data/steam.json (and data/steam-history.json) with the
# visualizer's Steam Workshop numbers. It only commits when a number changed.
# GitHub may start scheduled runs a few minutes late; that is normal.
name: Update Steam stats

on:
  schedule:
    - cron: '17 * * * *'   # every hour at minute 17
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Same group as the "Add item" form, so the two never push at the same moment.
concurrency:
  group: site-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-steam.mjs
      - name: Commit if the numbers changed
        run: |
          if git diff --quiet data/steam.json data/steam-history.json && [ -z "$(git ls-files --others --exclude-standard data/steam-history.json)" ]; then
            echo "Nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/steam.json data/steam-history.json
            git commit -m "Update Steam stats"
            git pull --rebase
            git push
          fi
